<!-- gps.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realtime location tracker</title>

    <!-- leaflet css  -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'leaflet/leaflet.css' %}" />

    <style>
        body {
            margin: 0;
            padding: 0;
        }

        #map {
            width: 100%;
            height: 100vh;
        }

        /* Modal */
        .modal {
            display: block;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.4);
            /* Semi-transparent black background */
        }

        /* Modal Content */
        .modal-content {
            background-color: #fefefe;
            margin: 10% auto;
            /* Centered vertically and slightly closer to the top */
            padding: 20px;
            border: 1px solid #888;
            width: 60%;
            /* Width of the modal content */
            max-width: 500px;
            /* Maximum width to ensure it's not too wide */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            /* Soft shadow effect */
            border-radius: 8px;
            /* Rounded corners */
        }

        /* Close Button */
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
        }

        /* Textarea */
        .modal-content textarea {

            width: 100%;
            /* Full width within the modal content */
            height: 240px;
            /* Fixed height or adjust as needed */
            box-sizing: border-box;
            /* Ensure padding and border are included in width */
            margin-bottom: 10px;
            /* Space below the textarea */
            padding: 10px;
            /* Padding inside the textarea */
            font-size: 14px;
            /* Font size */
            border: 1px solid #ccc;
            /* Light border */
            border-radius: 4px;
            /* Rounded corners */
            resize: block;
            /* Allow vertical resizing */
        }

        /* Button */
        .modal-content button {
            background-color: #007bff;
            /* Blue background */
            color: white;
            /* White text */
            border: none;
            /* No border */
            padding: 10px 20px;
            /* Padding */
            text-align: center;
            /* Center text */
            text-decoration: none;
            /* No underline */
            display: inline-block;
            /* Inline block */
            font-size: 16px;
            /* Font size */
            cursor: pointer;
            /* Cursor pointer */
            border-radius: 4px;
            /* Rounded corners */
        }

        .modal-content button:hover {
            background-color: #0056b3;
            /* Darker blue on hover */
        }

        .controling {
            display: flex;
            justify-content: space-between;
        }

        .leaflet-bar button {
            background-color: white;
            border: none;
            padding: 5px;
            cursor: pointer;
        }

        .leaflet-bar button:hover {
            background-color: #f4f4f4;
        }
    </style>
</head>

<body>
    <div id="myModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h1>Put your coordinates here bro..</h1>
            <h6>EX: 36.70256, 3.10450</h6>
            <textarea id="coordinate"></textarea>
            <div class="controling">
                <button id="traceBtn">trace coordinates</button>
                <select id="color">
                    <option value="black">Black</option>
                    <option value="white">White</option>
                    <option value="blue">Blue</option>
                    <option value="red">Red</option>
                    <option value="green">Green</option>

                </select>
            </div>
        </div>
    </div>

    <div id="map"></div>
</body>

</html>

<!-- leaflet js  -->
<script src="{% static 'leaflet/leaflet.js' %}" type="text/javascript"></script>
<script>
    var button1;
    var co = 0;

    let uri = "ws://localhost:8000/"
    var map = L.map('map').setView([36.7538, 3.1588], 12);
    var osm = L.tileLayer(uri + 'tracker/tiles/{z}/{x}/{y}.png');
    osm.on('tileerror', function (error) {
        console.log('the tile: ' + error.tile.src + " does not exist yet...");
    });
    osm.addTo(map);
    L.control.scale().addTo(map);

    var modal = document.getElementById("myModal");
    var span = document.getElementsByClassName("close")[0];
    var btn = document.getElementById("traceBtn")
    var coord = document.getElementById("coordinate")

    var customControl = L.Control.extend({
        options: {
            position: 'topleft'
        },
        onAdd: function (map) {
            var container = L.DomUtil.create('div', 'leaflet-bar');

            button1 = L.DomUtil.create('button', 'addButton', container);
            button1.disabled = true
            button1.innerHTML = 'Add';
            button1.onclick = function () {
                modal.style.display = "block";
                button1.disabled = true
            };

            return container;
        }
    });
    map.addControl(new customControl());

    btn.onclick = function (event) {
        var pathCoordinates = [];
        var color = document.getElementById("color").value
        str = coord.value.split("\n")
        var cor = []
        for (let index = 0; index < str.length; index++) {
            cor = str[index].split(",");
            if (cor.length != 2 || isNaN(cor[0]) || isNaN(cor[1]))
                continue
            pathCoordinates.push([parseFloat(cor[0]), parseFloat(cor[1])])
        }
        if (cor.length == 2 && !isNaN(cor[0]) && !isNaN(cor[1])) {
            co++;
            button1.disabled = false;
            modal.style.display = "none";
            var polyline = L.polyline(pathCoordinates, { color: color, weight: 5 }).addTo(map);
            var markerS = L.marker(pathCoordinates[0]).addTo(map);
            var markerE = L.marker(pathCoordinates[pathCoordinates.length - 1]).addTo(map);

            markerS.bindPopup("<b>Starting point " + co + "</b>", { keepInView: true, autoClose: false, closeButton: false }).openPopup();
            markerE.bindPopup("<b>Ending point " + co + "</b>", { keepInView: true, autoClose: false, closeButton: false }).openPopup();
        } else
            alert("Try to write the correct coordinate")
    }

    span.onclick = function () {
        modal.style.display = "none";
        button1.disabled = false;
    }

</script>
